# Prometheus scrape config for Gemini Vision Studio
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "local"

rule_files:
  - alerts.yml

scrape_configs:
  # FastAPI application (metrics from API + Celery worker via multiprocess dir)
  - job_name: "gemini-vision-studio"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]   # Docker Desktop (Prometheus in container)
        labels:
          service: "api"
      - targets: ["localhost:8000"]              # native Windows Prometheus binary
        labels:
          service: "api"

  # MinIO server metrics (S3 API + internals)
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:9000"]
        labels:
          service: "minio"
      - targets: ["localhost:9000"]
        labels:
          service: "minio"
